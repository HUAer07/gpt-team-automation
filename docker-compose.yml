services:
  gpt-team-console:
    build: .
    container_name: gpt_team_worker
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
    command: ./entrypoint.sh
    shm_size: '2gb'
