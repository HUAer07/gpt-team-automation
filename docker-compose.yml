services:
  gpt-team-console:
    build: .
    container_name: gpt_team_worker
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      - .:/app
    environment:
      - TZ=America/New_York
      - PYTHONUNBUFFERED=1
    command: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 -ac" python -m uvicorn server:app --host 0.0.0.0 --port 8899
    shm_size: '2gb'
